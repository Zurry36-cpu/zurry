<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MegaDeals - Ofertas Incríveis Todo Dia</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #FF6B00;
            --secondary: #FF9500;
            --dark: #1A1A1A;
            --light: #F5F5F5;
            --gray: #E0E0E0;
            --success: #4CAF50;
            --danger: #F44336;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        
        body {
            background-color: var(--light);
            color: var(--dark);
        }
        
        /* Header */
        .top-bar {
            background-color: var(--dark);
            color: white;
            padding: 8px 0;
            font-size: 0.8rem;
        }
        
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
        }
        
        .flex {
            display: flex;
            align-items: center;
        }
        
        .justify-between {
            justify-content: space-between;
        }
        
        .header {
            background-color: white;
            padding: 15px 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
        }
        
        .logo span {
            color: var(--secondary);
        }
        
        .search-bar {
            flex: 1;
            margin: 0 20px;
            position: relative;
        }
        
        .search-bar input {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid var(--gray);
            border-radius: 30px;
            outline: none;
            transition: all 0.3s;
        }
        
        .search-bar input:focus {
            border-color: var(--primary);
        }
        
        .search-bar button {
            position: absolute;
            right: 5px;
            top: 5px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
        }
        
        .user-actions a {
            color: var(--dark);
            margin-left: 15px;
            text-decoration: none;
            font-size: 0.9rem;
        }
        
        .user-actions a:hover {
            color: var(--primary);
        }
        
        .cart-icon {
            position: relative;
        }
        
        .cart-count {
            position: absolute;
            top: -8px;
            right: -8px;
            background-color: var(--danger);
            color: white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Modal de Login */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            position: relative;
        }
        
        .close-modal {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 1.5rem;
            cursor: pointer;
            color: #777;
        }
        
        .close-modal:hover {
            color: var(--dark);
        }
        
        .modal h2 {
            margin-bottom: 20px;
            color: var(--primary);
            text-align: center;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--gray);
            border-radius: 4px;
            font-size: 1rem;
        }
        
        .form-group input:focus {
            border-color: var(--primary);
            outline: none;
        }
        
        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .login-btn:hover {
            background-color: #e05a00;
        }
        
        .login-options {
            margin-top: 20px;
            text-align: center;
        }
        
        .login-options a {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.9rem;
        }
        
        .login-options a:hover {
            text-decoration: underline;
        }
        
        .divider {
            margin: 20px 0;
            text-align: center;
            position: relative;
            color: #777;
        }
        
        .divider::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background-color: var(--gray);
            z-index: -1;
        }
        
        .divider span {
            background-color: white;
            padding: 0 10px;
        }
        
        .social-login {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        
        .social-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
        }
        
        .facebook {
            background-color: #3b5998;
        }
        
        .google {
            background-color: #db4437;
        }
        
        .apple {
            background-color: #000;
        }
        
        /* Restante do CSS permanece igual */
        /* ... (mantenha todo o restante do CSS anterior) ... */
        
    </style>
</head>
<body>
    <!-- Top Bar -->
    <div class="top-bar">
        <div class="container flex justify-between">
            <div>Frete grátis para pedidos acima de R$99</div>
            <div>
                <a href="#" style="color: white; text-decoration: none; margin-left: 15px;">Acompanhar Pedido</a>
                <a href="#" style="color: white; text-decoration: none; margin-left: 15px;">Ajuda</a>
            </div>
        </div>
    </div>
    
    <!-- Header -->
    <header class="header">
        <div class="container flex justify-between">
            <div class="logo">Mega<span>Deals</span></div>
            
            <div class="search-bar">
                <input type="text" placeholder="Busque por produtos, marcas e mais...">
                <button><i class="fas fa-search"></i></button>
            </div>
            
            <div class="user-actions flex">
                <a href="#" id="login-btn"><i class="fas fa-user"></i> Entrar</a>
                <a href="#"><i class="fas fa-heart"></i> Favoritos</a>
                <a href="#" class="cart-icon">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count">3</span>
                </a>
            </div>
        </div>
    </header>
    
    <!-- Modal de Login -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <span class="close-modal" id="closeModal">&times;</span>
            <h2>Entrar na sua conta</h2>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="Digite seu e-mail" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" placeholder="Digite sua senha" required>
                </div>
                
                <button type="submit" class="login-btn">Entrar</button>
            </form>
            
            <div class="login-options">
                <a href="#">Esqueceu sua senha?</a>
            </div>
            
            <div class="divider">
                <span>ou</span>
            </div>
            
            <div class="social-login">
                <div class="social-btn facebook">
                    <i class="fab fa-facebook-f"></i>
                </div>
                <div class="social-btn google">
                    <i class="fab fa-google"></i>
                </div>
                <div class="social-btn apple">
                    <i class="fab fa-apple"></i>
                </div>
            </div>
            
            <div class="login-options" style="margin-top: 30px;">
                Não tem uma conta? <a href="#">Cadastre-se</a>
            </div>
        </div>
    </div>
    
    <!-- Restante do conteúdo permanece igual -->
    <!-- ... (mantenha todo o restante do HTML anterior) ... -->

    <script>
        // JavaScript para controlar o modal de login
        document.addEventListener('DOMContentLoaded', function() {
            const modal = document.getElementById('loginModal');
            const loginBtn = document.getElementById('login-btn');
            const closeModal = document.getElementById('closeModal');
            const loginForm = document.getElementById('loginForm');
            
            // Abrir modal ao clicar em "Entrar"
            loginBtn.addEventListener('click', function(e) {
                e.preventDefault();
                modal.style.display = 'flex';
            });
            
            // Fechar modal ao clicar no X
            closeModal.addEventListener('click', function() {
                modal.style.display = 'none';
            });
            
            // Fechar modal ao clicar fora do conteúdo
            window.addEventListener('click', function(e) {
                if (e.target === modal) {
                    modal.style.display = 'none';
                }
            });
            
            // Processar formulário de login
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                
                // Aqui você pode adicionar a lógica de autenticação
                console.log('E-mail:', email);
                console.log('Senha:', password);
                
                // Simulando login bem-sucedido
                alert('Login realizado com sucesso!');
                modal.style.display = 'none';
                
                // Atualizar interface para mostrar que o usuário está logado
                loginBtn.innerHTML = '<i class="fas fa-user-check"></i> Minha Conta';
            });
        });
    </script>
</body>
</html>
