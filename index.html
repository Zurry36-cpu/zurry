<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MegaDeals - Ofertas Incríveis Todo Dia</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #FF6B00;
            --secondary: #FF9500;
            --dark: #1A1A1A;
            --light: #F5F5F5;
            --gray: #E0E0E0;
            --success: #4CAF50;
            --danger: #F44336;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        
        body {
            background-color: var(--light);
            color: var(--dark);
        }
        
        /* Header */
        .top-bar {
            background-color: var(--dark);
            color: white;
            padding: 8px 0;
            font-size: 0.8rem;
        }
        
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
        }
        
        .flex {
            display: flex;
            align-items: center;
        }
        
        .justify-between {
            justify-content: space-between;
        }
        
        .header {
            background-color: white;
            padding: 15px 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
        }
        
        .logo span {
            color: var(--secondary);
        }
        
        .search-bar {
            flex: 1;
            margin: 0 20px;
            position: relative;
        }
        
        .search-bar input {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid var(--gray);
            border-radius: 30px;
            outline: none;
            transition: all 0.3s;
        }
        
        .search-bar input:focus {
            border-color: var(--primary);
        }
        
        .search-bar button {
            position: absolute;
            right: 5px;
            top: 5px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
        }
        
        .user-actions a {
            color: var(--dark);
            margin-left: 15px;
            text-decoration: none;
            font-size: 0.9rem;
        }
        
        .user-actions a:hover {
            color: var(--primary);
        }
        
        .cart-icon {
            position: relative;
        }
        
        .cart-count {
            position: absolute;
            top: -8px;
            right: -8px;
            background-color: var(--danger);
            color: white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            position: relative;
        }
        
        .close-modal {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 1.5rem;
            cursor: pointer;
            color: #777;
        }
        
        .close-modal:hover {
            color: var(--dark);
        }
        
        .modal h2 {
            margin-bottom: 20px;
            color: var(--primary);
            text-align: center;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--gray);
            border-radius: 4px;
            font-size: 1rem;
        }
        
        .form-group input:focus {
            border-color: var(--primary);
            outline: none;
        }
        
        .form-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .form-btn:hover {
            background-color: #e05a00;
        }
        
        .form-options {
            margin-top: 20px;
            text-align: center;
        }
        
        .form-options a {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.9rem;
        }
        
        .form-options a:hover {
            text-decoration: underline;
        }
        
        /* Restante do CSS permanece igual */
        /* ... (mantenha todo o restante do CSS anterior) ... */
        
    </style>
</head>
<body>
    <!-- Top Bar -->
    <div class="top-bar">
        <div class="container flex justify-between">
            <div>Frete grátis para pedidos acima de R$99</div>
            <div>
                <a href="#" style="color: white; text-decoration: none; margin-left: 15px;">Acompanhar Pedido</a>
                <a href="#" style="color: white; text-decoration: none; margin-left: 15px;">Ajuda</a>
            </div>
        </div>
    </div>
    
    <!-- Header -->
    <header class="header">
        <div class="container flex justify-between">
            <div class="logo">Mega<span>Deals</span></div>
            
            <div class="search-bar">
                <input type="text" placeholder="Busque por produtos, marcas e mais...">
                <button><i class="fas fa-search"></i></button>
            </div>
            
            <div class="user-actions flex">
                <a href="#" id="login-btn"><i class="fas fa-user"></i> Entrar</a>
                <a href="#"><i class="fas fa-heart"></i> Favoritos</a>
                <a href="#" class="cart-icon">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count">3</span>
                </a>
            </div>
        </div>
    </header>
    
    <!-- Modal de Login -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <span class="close-modal" id="closeLoginModal">&times;</span>
            <h2>Entrar na sua conta</h2>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="Digite seu e-mail" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" placeholder="Digite sua senha" required>
                </div>
                
                <button type="submit" class="form-btn">Entrar</button>
            </form>
            
            <div class="form-options">
                <a href="#" id="forgot-password">Esqueceu sua senha?</a>
            </div>
            
            <div class="form-options">
                Não tem uma conta? <a href="#" id="showRegister">Cadastre-se</a>
            </div>
        </div>
    </div>
    
    <!-- Modal de Cadastro -->
    <div class="modal" id="registerModal">
        <div class="modal-content">
            <span class="close-modal" id="closeRegisterModal">&times;</span>
            <h2>Criar nova conta</h2>
            
            <form id="registerForm">
                <div class="form-group">
                    <label for="reg-name">Nome completo</label>
                    <input type="text" id="reg-name" placeholder="Digite seu nome completo" required>
                </div>
                
                <div class="form-group">
                    <label for="reg-email">E-mail</label>
                    <input type="email" id="reg-email" placeholder="Digite seu e-mail" required>
                </div>
                
                <div class="form-group">
                    <label for="reg-password">Senha</label>
                    <input type="password" id="reg-password" placeholder="Crie uma senha (mínimo 6 caracteres)" required minlength="6">
                </div>
                
                <div class="form-group">
                    <label for="reg-confirm-password">Confirmar senha</label>
                    <input type="password" id="reg-confirm-password" placeholder="Digite a senha novamente" required>
                </div>
                
                <button type="submit" class="form-btn">Criar conta</button>
            </form>
            
            <div class="form-options">
                Já tem uma conta? <a href="#" id="showLogin">Entrar</a>
            </div>
        </div>
    </div>
    
    <!-- Restante do conteúdo permanece igual -->
    <!-- ... (mantenha todo o restante do HTML anterior) ... -->

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Elementos do modal de login
            const loginModal = document.getElementById('loginModal');
            const loginBtn = document.getElementById('login-btn');
            const closeLoginModal = document.getElementById('closeLoginModal');
            const loginForm = document.getElementById('loginForm');
            const showRegister = document.getElementById('showRegister');
            
            // Elementos do modal de cadastro
            const registerModal = document.getElementById('registerModal');
            const closeRegisterModal = document.getElementById('closeRegisterModal');
            const registerForm = document.getElementById('registerForm');
            const showLogin = document.getElementById('showLogin');
            
            // Abrir modal de login
            loginBtn.addEventListener('click', function(e) {
                e.preventDefault();
                loginModal.style.display = 'flex';
            });
            
            // Fechar modal de login
            closeLoginModal.addEventListener('click', function() {
                loginModal.style.display = 'none';
            });
            
            // Mostrar modal de cadastro
            showRegister.addEventListener('click', function(e) {
                e.preventDefault();
                loginModal.style.display = 'none';
                registerModal.style.display = 'flex';
            });
            
            // Fechar modal de cadastro
            closeRegisterModal.addEventListener('click', function() {
                registerModal.style.display = 'none';
            });
            
            // Mostrar modal de login a partir do cadastro
            showLogin.addEventListener('click', function(e) {
                e.preventDefault();
                registerModal.style.display = 'none';
                loginModal.style.display = 'flex';
            });
            
            // Fechar modais ao clicar fora
            window.addEventListener('click', function(e) {
                if (e.target === loginModal) {
                    loginModal.style.display = 'none';
                }
                if (e.target === registerModal) {
                    registerModal.style.display = 'none';
                }
            });
            
            // Processar formulário de login
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                
                // Validação básica
                if (!email || !password) {
                    alert('Por favor, preencha todos os campos!');
                    return;
                }
                
                // Simulação de login bem-sucedido
                console.log('Login com:', email, password);
                alert('Login realizado com sucesso!');
                loginModal.style.display = 'none';
                
                // Atualizar interface do usuário
                loginBtn.innerHTML = '<i class="fas fa-user-check"></i> Minha Conta';
            });
            
            // Processar formulário de cadastro
            registerForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const name = document.getElementById('reg-name').value;
                const email = document.getElementById('reg-email').value;
                const password = document.getElementById('reg-password').value;
                const confirmPassword = document.getElementById('reg-confirm-password').value;
                
                // Validações
                if (!name || !email || !password || !confirmPassword) {
                    alert('Por favor, preencha todos os campos!');
                    return;
                }
                
                if (password !== confirmPassword) {
                    alert('As senhas não coincidem!');
                    return;
                }
                
                if (password.length < 6) {
                    alert('A senha deve ter pelo menos 6 caracteres!');
                    return;
                }
                
                // Simulação de cadastro bem-sucedido
                console.log('Novo cadastro:', { name, email, password });
                alert('Cadastro realizado com sucesso! Faça login para continuar.');
                registerModal.style.display = 'none';
                loginModal.style.display = 'flex';
                
                // Limpar formulário
                registerForm.reset();
            });
        });
    </script>
</body>
</html>
